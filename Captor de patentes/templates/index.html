<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPR - Verificación de Patentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --electric-blue: #0062FF;
            --cta-blue: #0075FF;
            --soft-blue: #E5F0FF;
            --navy: #081C38;
            --paper: #F4F6FA;
            --white: #FFFFFF;
            --tab-blue: #EBF3FE;
            --ink: #1E293B;
            --muted: #64748B;
            --help: #94A3B8;
            --line: #E2E8F0;
            --confirmed-bg: #D1FAE5;
            --confirmed-text: #065F46;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            background: var(--paper);
        }

        .app-shell {
            max-width: 1040px;
            padding: 0 20px 72px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--white);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .brand-logo {
            display: block;
            width: min(100%, 330px);
            height: 92px;
            margin: 0 auto 20px;
            padding: 8px 14px;
            border-radius: 9px;
            background: var(--white);
            box-shadow: 0 6px 16px rgba(8, 28, 56, .14);
            object-fit: contain;
        }

        .brand-mark {
            display: none;
        }

        .brand-mark::before {
            width: 10px;
            height: 10px;
            content: '';
            border-radius: 50%;
            background: var(--white);
            box-shadow: 0 0 0 5px rgba(255, 255, 255, .2);
        }

        h1, h2, h5 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .page-heading {
            max-width: 760px;
            margin: 0 auto 34px;
            padding: 28px 24px 32px;
            text-align: center;
            border-radius: 0 0 18px 18px;
            background: var(--electric-blue);
            box-shadow: 0 12px 28px rgba(0, 98, 255, .16);
        }

        .page-heading h1 {
            margin: 0 0 8px;
            color: var(--white);
            font-size: 2.55rem;
            line-height: 1.08;
            letter-spacing: 0;
        }

        .page-heading p {
            margin: 0;
            color: rgba(255, 255, 255, .84);
            font-size: .98rem;
        }

        .workflow-card {
            max-width: 720px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--white);
            box-shadow: 0 18px 45px rgba(8, 28, 56, .08);
        }

        .workflow-card .card-body {
            padding: 34px;
        }

        .section-kicker {
            margin-bottom: 7px;
            color: var(--electric-blue);
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.35rem;
        }

        .upload-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            min-height: 48px;
            border-radius: 9px;
            font-weight: 600;
            transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(8, 28, 56, .12);
        }

        .btn-primary {
            border-color: var(--cta-blue);
            background: var(--cta-blue);
        }

        .btn-primary:hover, .btn-primary:focus {
            border-color: var(--electric-blue);
            background: var(--electric-blue);
        }

        .btn-outline-primary {
            color: var(--electric-blue);
            border-color: var(--electric-blue);
            background: var(--tab-blue);
        }

        .btn-outline-primary:hover, .btn-outline-primary:focus {
            color: var(--electric-blue);
            border-color: var(--electric-blue);
            background: var(--soft-blue);
        }

        .file-note {
            min-height: 22px;
            margin-top: 12px;
            color: var(--muted);
            font-size: .86rem;
        }

        .camera-panel {
            margin-top: 18px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--navy);
        }

        .camera-frame {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: #020b18;
        }

        .camera-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .roi-guide {
            position: absolute;
            top: 25%;
            left: 10%;
            width: 80%;
            height: 50%;
            border: 3px solid var(--cta-blue);
            border-radius: 10px;
            box-shadow: 0 0 0 999px rgba(8, 28, 56, .48);
            pointer-events: none;
        }

        .roi-guide::after {
            position: absolute;
            right: 0;
            bottom: -30px;
            left: 0;
            color: var(--white);
            content: 'Ubica la patente dentro del marco';
            font-size: .78rem;
            text-align: center;
        }

        .camera-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px;
        }

        .process-button {
            margin-top: 18px;
        }

        .result-card {
            margin-top: 20px;
        }

        .result-card .card-body {
            padding-top: 30px;
        }

        #platePreview {
            display: block;
            width: 100%;
            max-height: 260px;
            min-height: 150px;
            margin: 0 auto 18px;
            border-radius: 10px !important;
            object-fit: contain;
            border: 1px solid var(--line) !important;
            background: var(--tab-blue);
        }

        #confidenceBadge {
            padding: 8px 12px;
            border-radius: 999px;
            color: var(--navy);
            background: var(--soft-blue);
            font-weight: 600;
        }

        #finalText {
            border-color: var(--line);
            background: var(--white);
            border-radius: 10px;
            min-height: 56px;
            letter-spacing: 3px;
        }

        #finalText:focus {
            border-color: var(--cta-blue);
            box-shadow: 0 0 0 .2rem rgba(0, 117, 255, .14);
        }

        .review-list {
            max-width: 680px;
            margin: 20px auto 0;
        }

        .review-list .card-body {
            padding: 28px 34px;
        }

        .plate-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 13px 0;
            border-bottom: 1px solid var(--line);
        }

        .plate-row:last-child {
            border-bottom: 0;
        }

        .plate-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .plate-meta {
            color: var(--muted);
            font-size: .82rem;
        }

        .duplicate-row {
            margin: 0 -10px;
            padding-right: 10px;
            padding-left: 10px;
            border-radius: 8px;
            background: var(--soft-blue);
        }

        .empty-list {
            color: var(--muted);
            text-align: center;
        }

        .btn-success {
            border-color: var(--confirmed-text);
            background: var(--confirmed-text);
        }

        .btn-success:hover, .btn-success:focus {
            border-color: #047857;
            background: #047857;
        }

        #listStatus.text-success,
        #saveStatus.text-success {
            color: var(--confirmed-text) !important;
        }

        @media (max-width: 520px) {
            .app-shell {
                padding-top: 34px;
            }

            .page-heading h1 {
                font-size: 2rem;
            }

            .workflow-card .card-body,
            .review-list .card-body {
                padding: 26px 22px;
            }

            .upload-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<main class="container app-shell">
    <header class="page-heading">
        <img class="brand-logo" src="/static/chulean-logo.png" alt="Chilean Leasing operativo - rent a car">
        <div class="brand-mark">Captor de patentes</div>
        <h1>Verificación de patentes</h1>
        <p>Sube una imagen para leerla y confirmar el resultado.</p>
    </header>
    
    <div class="row justify-content-center">
        <div class="col-12">
            <!-- Carga de Imagen -->
            <div class="card workflow-card">
                <div class="card-body">
                    <form id="uploadForm">
                        <div>
                            <div class="section-kicker">Paso 1</div>
                            <h2 class="section-title">Elige una imagen</h2>
                            <div class="upload-actions">
                                <button type="button" class="btn btn-primary" id="btnCamera">Tomar foto</button>
                                <button type="button" class="btn btn-outline-primary" id="btnFile">Subir archivo</button>
                            </div>
                            <input type="file" class="d-none" id="fileInput" accept="image/*">
                            <div class="file-note" id="selectedFileName">Ninguna imagen seleccionada</div>
                            <div class="camera-panel d-none" id="cameraPanel">
                                <div class="camera-frame">
                                    <video id="cameraPreview" autoplay playsinline muted></video>
                                    <div class="roi-guide"></div>
                                </div>
                                <div class="camera-actions">
                                    <button type="button" class="btn btn-primary" id="btnCapture">Capturar patente</button>
                                    <button type="button" class="btn btn-outline-light" id="btnCloseCamera">Cerrar cámara</button>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 process-button" id="btnProcess">Procesar imagen</button>
                        <div class="small mt-2 text-center" id="processStatus" role="status"></div>
                    </form>
                </div>
            </div>

            <!-- Resultado y Corrección Manual -->
            <div class="card workflow-card result-card d-none" id="resultCard">
                <div class="card-body text-center">
                    <div class="section-kicker">Paso 2</div>
                    <h2 class="section-title">Revisa el resultado</h2>
                    <img id="platePreview" src="" class="img-fluid rounded border mb-3" style="max-height: 200px;">
                    
                    <div class="mb-3">
                        <span class="badge bg-secondary" id="confidenceBadge">Confianza: 0%</span>
                    </div>

                    <form id="saveForm">
                        <input type="hidden" id="imageUrl">
                        <input type="hidden" id="detectedText">

                        <div class="mb-3 text-start">
                            <label for="finalText" class="form-label fw-bold">Patente detectada (Edita si hay un error):</label>
                            <input type="text" class="form-control form-control-lg text-center fw-bold" id="finalText" pattern="[A-Za-z0-9]+" inputmode="text" autocomplete="off" style="letter-spacing: 2px; text-transform: uppercase;" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Agregar a la lista</button>
                        <div class="small mt-2" id="saveStatus" role="status"></div>
                    </form>
                </div>
            </div>

            <div class="card workflow-card review-list d-none" id="reviewCard">
                <div class="card-body">
                    <div class="section-kicker">Paso 3</div>
                    <h2 class="section-title">Lista para confirmar</h2>
                    <div id="plateList"></div>
                    <div class="d-grid gap-2 mt-3">
                        <button type="button" class="btn btn-outline-primary" id="btnRemoveDuplicates">Eliminar repetidas</button>
                        <button type="button" class="btn btn-success" id="btnConfirmList">Confirmar y guardar lista</button>
                    </div>
                    <div class="small mt-2 text-center" id="listStatus" role="status"></div>
                </div>
            </div>

        </div>
    </div>
</main>

<script>
const uploadForm = document.getElementById('uploadForm');
const resultCard = document.getElementById('resultCard');
const fileInput = document.getElementById('fileInput');
const selectedFileName = document.getElementById('selectedFileName');
const processStatus = document.getElementById('processStatus');
const saveStatus = document.getElementById('saveStatus');
const cameraPanel = document.getElementById('cameraPanel');
const cameraPreview = document.getElementById('cameraPreview');
const reviewCard = document.getElementById('reviewCard');
const plateList = document.getElementById('plateList');
const listStatus = document.getElementById('listStatus');
let selectedFile = null;
let cameraStream = null;
let pendingPlates = [];

function normalizePlate(value) {
    return value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
}

function prepareImage(file) {
    return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
            const scale = Math.min(1, 1600 / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(resolve, 'image/jpeg', 0.82);
            URL.revokeObjectURL(image.src);
        };
        image.onerror = reject;
        image.src = URL.createObjectURL(file);
    });
}

document.getElementById('btnCamera').addEventListener('click', async () => {
    if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
        processStatus.textContent = 'La cámara integrada requiere HTTPS o la aplicación instalada.';
        processStatus.className = 'small mt-2 text-center text-danger';
        return;
    }

    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
        });
        cameraPreview.srcObject = cameraStream;
        cameraPanel.classList.remove('d-none');
        processStatus.textContent = 'Alinea la patente dentro del marco azul.';
        processStatus.className = 'small mt-2 text-center text-primary';
    } catch (error) {
        processStatus.textContent = 'No se pudo abrir la cámara integrada. Revisa el permiso de cámara.';
        processStatus.className = 'small mt-2 text-center text-danger';
    }
});
document.getElementById('btnFile').addEventListener('click', () => fileInput.click());

function closeCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
    }
    cameraPreview.srcObject = null;
    cameraPanel.classList.add('d-none');
}

document.getElementById('btnCloseCamera').addEventListener('click', closeCamera);

document.getElementById('btnCapture').addEventListener('click', () => {
    if (!cameraPreview.videoWidth || !cameraPreview.videoHeight) return;

    const crop = {
        x: Math.round(cameraPreview.videoWidth * .10),
        y: Math.round(cameraPreview.videoHeight * .25),
        width: Math.round(cameraPreview.videoWidth * .80),
        height: Math.round(cameraPreview.videoHeight * .50)
    };
    const canvas = document.createElement('canvas');
    canvas.width = crop.width;
    canvas.height = crop.height;
    canvas.getContext('2d').drawImage(
        cameraPreview,
        crop.x, crop.y, crop.width, crop.height,
        0, 0, crop.width, crop.height
    );
    canvas.toBlob((blob) => {
        if (!blob) return;
        selectedFile = new File([blob], 'patente-roi.jpg', { type: 'image/jpeg' });
        selectedFileName.textContent = 'Captura ROI lista para procesar';
        closeCamera();
        processStatus.textContent = 'Área capturada. Presiona Procesar imagen.';
        processStatus.className = 'small mt-2 text-center text-success';
    }, 'image/jpeg', .88);
});

function setSelectedFile(file) {
    selectedFile = file;
    selectedFileName.textContent = file ? `Seleccionado: ${file.name}` : 'Ninguna imagen seleccionada';
}

fileInput.addEventListener('change', () => setSelectedFile(fileInput.files[0]));

uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedFile) return;

    const formData = new FormData();
    const optimizedFile = await prepareImage(selectedFile);
    formData.append('file', optimizedFile, 'patente.jpg');

    document.getElementById('btnProcess').disabled = true;
    processStatus.textContent = 'Procesando imagen, puede tardar la primera vez...';
    processStatus.className = 'small mt-2 text-center text-primary';

    try {
        const res = await fetch('/api/scan', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.message || 'No se pudo procesar la imagen.');

        const previewUrl = URL.createObjectURL(selectedFile);
        document.getElementById('platePreview').src = previewUrl;
        document.getElementById('imageUrl').value = '';
        const normalizedText = normalizePlate(data.detected_text);
        document.getElementById('detectedText').value = normalizedText;
        document.getElementById('finalText').value = normalizedText;
        document.getElementById('confidenceBadge').textContent = `Confianza: ${data.confidence}%`;

        resultCard.classList.remove('d-none');
        processStatus.textContent = 'Imagen procesada.';
        processStatus.className = 'small mt-2 text-center text-success';
    } catch (error) {
        processStatus.textContent = error.message;
        processStatus.className = 'small mt-2 text-center text-danger';
    } finally {
        document.getElementById('btnProcess').disabled = false;
    }
});

document.getElementById('finalText').addEventListener('input', (e) => {
    e.target.value = normalizePlate(e.target.value);
});

document.getElementById('saveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const finalText = document.getElementById('finalText');
    finalText.value = normalizePlate(finalText.value);
    if (!finalText.value) {
        finalText.setCustomValidity('Ingresa una patente alfanumérica.');
        finalText.reportValidity();
        return;
    }
    finalText.setCustomValidity('');
    pendingPlates.push({
        detected_text: document.getElementById('detectedText').value,
        final_text: finalText.value,
        confidence: Number(document.getElementById('confidenceBadge').textContent.replace(/[^0-9.]/g, '')) || 0
    });
    renderPlateList();
    resultCard.classList.add('d-none');
    uploadForm.reset();
    selectedFile = null;
    selectedFileName.textContent = 'Ninguna imagen seleccionada';
    saveStatus.textContent = 'Agregada a la lista.';
    saveStatus.className = 'small mt-2 text-success';
});

function renderPlateList() {
    reviewCard.classList.toggle('d-none', pendingPlates.length === 0);
    plateList.innerHTML = '';
    if (!pendingPlates.length) {
        plateList.innerHTML = '<div class="empty-list">Aún no hay patentes en la lista.</div>';
        return;
    }

    const counts = pendingPlates.reduce((all, item) => {
        all[item.final_text] = (all[item.final_text] || 0) + 1;
        return all;
    }, {});
    pendingPlates.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = `plate-row ${counts[item.final_text] > 1 ? 'duplicate-row' : ''}`;
        row.innerHTML = `<div><div class="plate-value">${item.final_text}</div><div class="plate-meta">Confianza: ${item.confidence}%${counts[item.final_text] > 1 ? ' · Repetida' : ''}</div></div><button type="button" class="btn btn-sm btn-outline-danger" data-index="${index}">Eliminar</button>`;
        row.querySelector('button').addEventListener('click', () => {
            pendingPlates.splice(index, 1);
            renderPlateList();
        });
        plateList.appendChild(row);
    });
}

document.getElementById('btnRemoveDuplicates').addEventListener('click', () => {
    const unique = new Map();
    pendingPlates.forEach((item) => unique.set(item.final_text, item));
    pendingPlates = [...unique.values()];
    renderPlateList();
    listStatus.textContent = 'Repetidas eliminadas.';
    listStatus.className = 'small mt-2 text-center text-success';
});

document.getElementById('btnConfirmList').addEventListener('click', async () => {
    if (!pendingPlates.length) return;
    listStatus.textContent = 'Guardando lista...';
    listStatus.className = 'small mt-2 text-center text-primary';
    try {
        const res = await fetch('/api/save-batch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ records: pendingPlates })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'No se pudo guardar la lista.');
        pendingPlates = [];
        renderPlateList();
        listStatus.textContent = 'Lista guardada correctamente.';
        listStatus.className = 'small mt-2 text-center text-success';
    } catch (error) {
        listStatus.textContent = error.message;
        listStatus.className = 'small mt-2 text-center text-danger';
    }
});
</script>
</body>
</html>
