<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPR - Verificación de Patentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #17252b;
            --muted: #68767a;
            --paper: #f5f7f4;
            --line: #dce5e1;
            --teal: #087f78;
            --teal-dark: #05615d;
            --mint: #e4f3ee;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(circle at 10% 0%, #e7f3ee 0, transparent 36%), var(--paper);
        }

        .app-shell {
            max-width: 1040px;
            padding: 56px 20px 72px;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--teal);
            font-size: .78rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .brand-mark::before {
            width: 10px;
            height: 10px;
            content: '';
            border-radius: 50%;
            background: #ee9f48;
            box-shadow: 0 0 0 5px #f9e7d3;
        }

        h1, h2, h5 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .page-heading {
            max-width: 600px;
            margin: 16px auto 34px;
            text-align: center;
        }

        .page-heading h1 {
            margin-bottom: 10px;
            font-size: 3rem;
            letter-spacing: 0;
        }

        .page-heading p {
            margin: 0;
            color: var(--muted);
            font-size: 1.02rem;
        }

        .workflow-card {
            max-width: 680px;
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, .88);
            box-shadow: 0 18px 45px rgba(23, 67, 63, .08);
        }

        .workflow-card .card-body {
            padding: clamp(24px, 5vw, 42px);
        }

        .section-kicker {
            margin-bottom: 7px;
            color: var(--teal);
            font-size: .76rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .section-title {
            margin-bottom: 24px;
            font-size: 1.45rem;
        }

        .upload-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            min-height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

        .btn-primary {
            border-color: var(--teal);
            background: var(--teal);
        }

        .btn-primary:hover, .btn-primary:focus {
            border-color: var(--teal-dark);
            background: var(--teal-dark);
        }

        .btn-outline-primary {
            color: var(--teal);
            border-color: #9bcac1;
        }

        .btn-outline-primary:hover, .btn-outline-primary:focus {
            color: var(--teal-dark);
            border-color: #9bcac1;
            background: var(--mint);
        }

        .file-note {
            min-height: 22px;
            margin-top: 12px;
            color: var(--muted);
            font-size: .86rem;
        }

        .process-button {
            margin-top: 18px;
        }

        .result-card {
            margin-top: 20px;
        }

        .result-card .card-body {
            padding-top: 30px;
        }

        #platePreview {
            display: block;
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border: 1px solid var(--line) !important;
            background: #eef3f0;
        }

        #confidenceBadge {
            padding: 8px 12px;
            color: var(--teal-dark);
            background: var(--mint);
            font-weight: 600;
        }

        #finalText {
            border-color: #b7cbc5;
            border-radius: 10px;
            letter-spacing: 3px;
        }

        #finalText:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 .2rem rgba(8, 127, 120, .12);
        }

        @media (max-width: 520px) {
            .app-shell {
                padding-top: 34px;
            }

            .page-heading h1 {
                font-size: 2.2rem;
            }

            .upload-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<main class="container app-shell">
    <header class="page-heading">
        <div class="brand-mark">Captor de patentes</div>
        <h1>Verificación de patentes</h1>
        <p>Sube una imagen para leerla y confirmar el resultado.</p>
    </header>
    
    <div class="row justify-content-center">
        <div class="col-12">
            <!-- Carga de Imagen -->
            <div class="card workflow-card">
                <div class="card-body">
                    <form id="uploadForm">
                        <div>
                            <div class="section-kicker">Paso 1</div>
                            <h2 class="section-title">Elige una imagen</h2>
                            <div class="upload-actions">
                                <button type="button" class="btn btn-primary" id="btnCamera">Tomar foto</button>
                                <button type="button" class="btn btn-outline-primary" id="btnFile">Subir archivo</button>
                            </div>
                            <input type="file" class="d-none" id="cameraInput" accept="image/*" capture="environment">
                            <input type="file" class="d-none" id="fileInput" accept="image/*">
                            <div class="file-note" id="selectedFileName">Ninguna imagen seleccionada</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 process-button" id="btnProcess">Procesar imagen</button>
                        <div class="small mt-2 text-center" id="processStatus" role="status"></div>
                    </form>
                </div>
            </div>

            <!-- Resultado y Corrección Manual -->
            <div class="card workflow-card result-card d-none" id="resultCard">
                <div class="card-body text-center">
                    <div class="section-kicker">Paso 2</div>
                    <h2 class="section-title">Revisa el resultado</h2>
                    <img id="platePreview" src="" class="img-fluid rounded border mb-3" style="max-height: 200px;">
                    
                    <div class="mb-3">
                        <span class="badge bg-secondary" id="confidenceBadge">Confianza: 0%</span>
                    </div>

                    <form id="saveForm">
                        <input type="hidden" id="imageUrl">
                        <input type="hidden" id="detectedText">

                        <div class="mb-3 text-start">
                            <label for="finalText" class="form-label fw-bold">Patente detectada (Edita si hay un error):</label>
                            <input type="text" class="form-control form-control-lg text-center fw-bold" id="finalText" pattern="[A-Za-z0-9]+" inputmode="text" autocomplete="off" style="letter-spacing: 2px; text-transform: uppercase;" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Confirmar y Guardar</button>
                        <div class="small mt-2" id="saveStatus" role="status"></div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<script>
const uploadForm = document.getElementById('uploadForm');
const resultCard = document.getElementById('resultCard');
const cameraInput = document.getElementById('cameraInput');
const fileInput = document.getElementById('fileInput');
const selectedFileName = document.getElementById('selectedFileName');
const processStatus = document.getElementById('processStatus');
const saveStatus = document.getElementById('saveStatus');
let selectedFile = null;

function normalizePlate(value) {
    return value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
}

function prepareImage(file) {
    return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
            const scale = Math.min(1, 1600 / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(resolve, 'image/jpeg', 0.82);
            URL.revokeObjectURL(image.src);
        };
        image.onerror = reject;
        image.src = URL.createObjectURL(file);
    });
}

document.getElementById('btnCamera').addEventListener('click', () => cameraInput.click());
document.getElementById('btnFile').addEventListener('click', () => fileInput.click());

function setSelectedFile(file) {
    selectedFile = file;
    selectedFileName.textContent = file ? `Seleccionado: ${file.name}` : 'Ninguna imagen seleccionada';
}

cameraInput.addEventListener('change', () => setSelectedFile(cameraInput.files[0]));
fileInput.addEventListener('change', () => setSelectedFile(fileInput.files[0]));

uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedFile) return;

    const formData = new FormData();
    const optimizedFile = await prepareImage(selectedFile);
    formData.append('file', optimizedFile, 'patente.jpg');

    document.getElementById('btnProcess').disabled = true;
    processStatus.textContent = 'Procesando imagen, puede tardar la primera vez...';
    processStatus.className = 'small mt-2 text-center text-primary';

    try {
        const res = await fetch('/api/scan', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.message || 'No se pudo procesar la imagen.');

        const previewUrl = URL.createObjectURL(selectedFile);
        document.getElementById('platePreview').src = previewUrl;
        document.getElementById('imageUrl').value = '';
        const normalizedText = normalizePlate(data.detected_text);
        document.getElementById('detectedText').value = normalizedText;
        document.getElementById('finalText').value = normalizedText;
        document.getElementById('confidenceBadge').textContent = `Confianza: ${data.confidence}%`;

        resultCard.classList.remove('d-none');
        processStatus.textContent = 'Imagen procesada.';
        processStatus.className = 'small mt-2 text-center text-success';
    } catch (error) {
        processStatus.textContent = error.message;
        processStatus.className = 'small mt-2 text-center text-danger';
    } finally {
        document.getElementById('btnProcess').disabled = false;
    }
});

document.getElementById('finalText').addEventListener('input', (e) => {
    e.target.value = normalizePlate(e.target.value);
});

document.getElementById('saveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const finalText = document.getElementById('finalText');
    finalText.value = normalizePlate(finalText.value);
    if (!finalText.value) {
        finalText.setCustomValidity('Ingresa una patente alfanumérica.');
        finalText.reportValidity();
        return;
    }
    finalText.setCustomValidity('');
    const formData = new FormData();
    formData.append('image_url', document.getElementById('imageUrl').value);
    formData.append('detected_text', document.getElementById('detectedText').value);
    formData.append('final_text', finalText.value);

    saveStatus.textContent = 'Guardando...';
    saveStatus.className = 'small mt-2 text-primary';
    try {
        const res = await fetch('/api/save', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'No se pudo guardar la patente.');
        saveStatus.textContent = 'Patente guardada correctamente.';
        saveStatus.className = 'small mt-2 text-success';
        resultCard.classList.add('d-none');
        uploadForm.reset();
        selectedFile = null;
        selectedFileName.textContent = 'Ninguna imagen seleccionada';
    } catch (error) {
        saveStatus.textContent = error.message;
        saveStatus.className = 'small mt-2 text-danger';
    }
});
</script>
</body>
</html>
